# Проверки на каждый push: типы, unit-тесты, SQL-тесты на PostgreSQL 16, сборка сайта.
# Публикацию делают Vercel и Cloudflare Pages, подключённые к этому репозиторию.
name: CI
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # PostgreSQL уже установлен в образе раннера: без скачивания Docker-образа (Docker Hub бывает недоступен)
      - name: PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
          psql --version
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: pnpm install --no-frozen-lockfile
      - name: Проверка типов
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck
      - name: Unit-тесты
        run: pnpm test
      - name: SQL-тесты (миграции, seed, RLS, конкуренция)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:db
      - name: Сборка сайта и оболочек студий
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: pnpm build && ls dist dist/t/*
      - name: Переадресация Cloudflare → Vercel
        env:
          CF_PAGES: "1"
        run: |
          pnpm exec tsx scripts/build-shells.ts >/dev/null
          cat dist/_redirects
          grep -qx "/s/\* https://sgx-booking-ten.vercel.app/s/:splat 301" dist/_redirects
          grep -qx "/admin/\* https://sgx-booking-ten.vercel.app/admin/:splat 301" dist/_redirects
          ! grep -q "^/t/" dist/_redirects
      - name: Сборка для Vercel и проверка маршрутов
        env:
          VERCEL: "1"
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: pnpm build:vercel && pnpm exec tsx scripts/check-vercel-routes.ts
      - name: Функция /api/push запускается
        run: |
          node -e '
            const h = require("./.vercel/output/functions/api/push.func/index.js");
            const fn = h.default || h;
            const { Readable } = require("node:stream");
            const call = (method, body) => new Promise((res) => {
              const req = Readable.from(body ? [body] : []); req.method = method; req.setEncoding = () => {};
              const out = { statusCode: 0, headers: {}, setHeader(k, v) { this.headers[k] = v; }, end(b) { res({ status: this.statusCode, body: b }); } };
              fn(req, out);
            });
            (async () => {
              const a = await call("GET"); const b = await call("POST", "{\"job\":\"x\"}");
              console.log(a, b);
              if (a.status !== 405 || b.status !== 400) process.exit(1);
            })();
          '
      - name: Итог проверки типов
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "Проверка типов не прошла — см. шаг «Проверка типов»"
          exit 1
